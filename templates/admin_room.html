<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cập Nhật Hóa Đơn - {{ room.room_number }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <!-- Nút quay lại -->
        <a href="/admin/dashboard" class="back-link">← Quay lại Dashboard</a>

        <div class="card payment-card">
            <!-- Tiêu đề -->
            <div class="payment-header">
                <div class="payment-title">CẬP NHẬT HÓA ĐƠN {{ room.room_number | upper }}</div>
                <div class="payment-period">Kỳ thanh toán: Tháng {{ payment_month }}/{{ payment_year }}</div>
            </div>

            <!-- Form cập nhật hóa đơn & trạng thái -->
            <form method="POST" action="/admin/room/{{ room.id }}" id="invoiceForm">
                <!-- 1. Tiền phòng -->
                <div class="form-group">
                    <label for="room_fee" class="form-label">1. Tiền phòng (VNĐ):</label>
                    <input type="number" id="room_fee" name="room_fee" class="form-input" 
                           value="{{ room.room_fee }}" min="0" step="10000" required>
                </div>

                <!-- 2. Tiền điện: Số điện & Đơn giá -->
                <div class="form-group">
                    <label for="electricity_units" class="form-label">2. Tiền điện:</label>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                        <div>
                            <span style="font-size: 0.8rem; color: var(--text-muted);">Số điện:</span>
                            <input type="number" id="electricity_units" name="electricity_units" class="form-input" 
                                   value="{{ room.electricity_units }}" min="0" placeholder="Số điện" required>
                        </div>
                        <div>
                            <span style="font-size: 0.8rem; color: var(--text-muted);">Đơn giá (VNĐ/số):</span>
                            <input type="number" id="electricity_price" name="electricity_price" class="form-input" 
                                   value="{{ room.electricity_price }}" min="0" step="100" placeholder="Đơn giá" required>
                        </div>
                    </div>
                    <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 6px;">
                        Thành tiền điện: <strong id="calcElectricityText" style="color: var(--primary-color);">0đ</strong>
                    </p>
                </div>

                <!-- 3. Tiền nước -->
                <div class="form-group">
                    <label for="water_fee" class="form-label">3. Tiền nước (VNĐ):</label>
                    <input type="number" id="water_fee" name="water_fee" class="form-input" 
                           value="{{ room.water_fee }}" min="0" step="5000" placeholder="Nhập tiền nước" required>
                </div>

                <!-- 4. Trạng thái thanh toán (3 Chế độ) -->
                <div class="form-group">
                    <label for="status" class="form-label" style="display: flex; justify-content: space-between;">
                        <span>4. Trạng thái thanh toán:</span>
                        <span style="font-size: 0.8rem; color: var(--primary-color); font-weight: normal;">(Admin tùy chỉnh)</span>
                    </label>
                    <select id="status" name="status" class="form-input" style="font-weight: 700; padding: 10px 12px; cursor: pointer;">
                        <option value="UNPAID" {% if room.status == 'UNPAID' %}selected{% endif %}>
                            🔴 Chưa thanh toán (UNPAID)
                        </option>
                        <option value="PENDING" {% if room.status == 'PENDING' %}selected{% endif %}>
                            🟡 Đang chờ duyệt (PENDING)
                        </option>
                        <option value="PAID" {% if room.status == 'PAID' %}selected{% endif %}>
                            🟢 Đã thanh toán (PAID)
                        </option>
                    </select>
                </div>

                <!-- Bảng tổng kết tiền tự động -->
                <div class="admin-fee-details" style="margin: 16px 0;">
                    <div style="font-weight: 700; font-size: 0.95rem; margin-bottom: 4px;">BẢNG TỔNG HỢP HÓA ĐƠN</div>
                    <div class="fee-item">
                        <span class="fee-label">Tiền phòng:</span>
                        <span class="fee-value" id="summaryRoomFee">0đ</span>
                    </div>
                    <div class="fee-item">
                        <span class="fee-label">Tiền điện:</span>
                        <span class="fee-value" id="summaryElectricityFee">0đ</span>
                    </div>
                    <div class="fee-item">
                        <span class="fee-label">Tiền nước:</span>
                        <span class="fee-value" id="summaryWaterFee">0đ</span>
                    </div>
                    <div class="fee-item fee-total">
                        <span class="fee-label" style="font-weight: 800; font-size: 1rem;">TỔNG THANH TOÁN:</span>
                        <span class="fee-value" id="summaryTotalAmount" style="font-size: 1.35rem; color: var(--primary-color); font-weight: 800;">
                            0đ
                        </span>
                    </div>
                </div>

                <!-- Nút lưu hóa đơn -->
                <button type="submit" class="btn btn-primary" style="font-size: 1.05rem; padding: 14px;">
                    💾 LƯU HÓA ĐƠN & TRẠNG THÁI
                </button>
            </form>
        </div>

        <footer class="footer">
            <a href="/admin/dashboard">← Quay lại Dashboard</a>
        </footer>
    </div>

    <!-- Script tự động tính tiền thời gian thực -->
    <script>
        function formatCurrency(amount) {
            return new Intl.NumberFormat('vi-VN').format(Math.round(amount)) + 'đ';
        }

        function calculateInvoice() {
            const roomFee = parseFloat(document.getElementById('room_fee').value) || 0;
            const electricityUnits = parseFloat(document.getElementById('electricity_units').value) || 0;
            const electricityPrice = parseFloat(document.getElementById('electricity_price').value) || 0;
            const waterFee = parseFloat(document.getElementById('water_fee').value) || 0;

            // Tính tiền điện = số điện * đơn giá
            const electricityFee = electricityUnits * electricityPrice;
            
            // Tính tổng tiền = Tiền phòng + Tiền điện + Tiền nước
            const totalAmount = roomFee + electricityFee + waterFee;

            // Cập nhật lên giao diện
            document.getElementById('calcElectricityText').innerText = 
                `${electricityUnits} số × ${formatCurrency(electricityPrice)} = ${formatCurrency(electricityFee)}`;
            document.getElementById('summaryRoomFee').innerText = formatCurrency(roomFee);
            document.getElementById('summaryElectricityFee').innerText = formatCurrency(electricityFee);
            document.getElementById('summaryWaterFee').innerText = formatCurrency(waterFee);
            document.getElementById('summaryTotalAmount').innerText = formatCurrency(totalAmount);
        }

        // Lắng nghe sự kiện người dùng nhập liệu
        document.getElementById('room_fee').addEventListener('input', calculateInvoice);
        document.getElementById('electricity_units').addEventListener('input', calculateInvoice);
        document.getElementById('electricity_price').addEventListener('input', calculateInvoice);
        document.getElementById('water_fee').addEventListener('input', calculateInvoice);

        // Tính toán ngay khi tải trang
        calculateInvoice();
    </script>
</body>
</html>
